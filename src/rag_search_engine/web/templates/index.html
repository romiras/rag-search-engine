<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAG Search Engine</title>
    <script src="https://unpkg.com/htmx.org@2.0.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
    <style>
      :root {
        --bg-color: #0d1117;
        --container-bg: #161b22;
        --text-main: #c9d1d9;
        --text-dim: #8b949e;
        --accent-blue: #58a6ff;
        --accent-green: #3fb950;
        --border-color: #30363d;
        --input-bg: #0d1117;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
        line-height: 1.6;
        max-width: 1500px;
        margin: 0 auto;
        padding: 40px 20px;
        background-color: var(--bg-color);
        color: var(--text-main);
      }

      h1 {
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 10px;
        margin-bottom: 20px;
      }

      /* Top-level Navigation Tabs */
      .nav-tabs {
        display: flex;
        gap: 8px;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 12px;
        margin-bottom: 20px;
      }
      .tab-btn {
        padding: 8px 18px;
        background: var(--container-bg);
        color: var(--text-dim);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.95em;
        transition: all 0.15s ease;
      }
      .tab-btn:hover {
        color: var(--text-main);
        border-color: var(--accent-blue);
      }
      .tab-btn.active {
        background: rgba(88, 166, 255, 0.15);
        color: var(--accent-blue);
        border-color: var(--accent-blue);
      }

      /* Overview Dashboard Styles */
      .overview-dashboard {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .overview-stats-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        padding: 16px 20px;
        background: var(--container-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
      }
      .stat-group {
        display: flex;
        gap: 28px;
        flex-wrap: wrap;
      }
      .stat-item {
        display: flex;
        flex-direction: column;
      }
      .stat-value {
        font-size: 1.35em;
        font-weight: 700;
        color: #f0f6fc;
      }
      .stat-label {
        font-size: 0.8em;
        color: var(--text-dim);
      }
      .overview-meta-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .overview-meta-text {
        font-size: 0.8em;
        color: var(--text-dim);
        font-family: Consolas, "Liberation Mono", Menlo, monospace;
      }
      .btn-secondary {
        background: #21262d;
        border: 1px solid var(--border-color);
        color: var(--text-main);
      }
      .btn-secondary:hover {
        border-color: var(--accent-blue);
      }
      .btn-sm {
        padding: 6px 12px;
        font-size: 0.85em;
      }
      .btn-xs {
        padding: 4px 10px;
        font-size: 0.78em;
      }
      .overview-panel-card {
        padding: 20px;
        background: var(--container-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
      }
      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
      }
      .panel-header h3 {
        margin: 0;
        font-size: 1.05em;
      }
      .panel-subtitle {
        font-size: 0.82em;
        color: var(--text-dim);
      }
      .svg-treemap-wrapper {
        width: 100%;
        overflow: hidden;
        border-radius: 6px;
      }
      .treemap-svg {
        width: 100%;
        height: auto;
        display: block;
      }
      .treemap-node {
        cursor: pointer;
      }
      .treemap-node:hover .treemap-rect {
        fill-opacity: 0.35;
        stroke-width: 2.2;
      }
      .treemap-node.active-filter .treemap-rect {
        fill-opacity: 0.42;
        stroke-width: 2.8;
      }
      .treemap-title {
        font-size: 14px;
        font-weight: 700;
      }
      .treemap-sub {
        font-size: 12px;
      }
      .treemap-sub-dim {
        font-size: 11px;
      }
      .root-pills-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }
      .root-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        background: #0d1117;
        border: 1px solid var(--border-color);
        border-radius: 999px;
        color: var(--text-main);
        cursor: pointer;
        font-size: 0.85em;
      }
      .root-pill:hover,
      .root-pill.active-filter {
        border-color: var(--accent-blue);
        background: rgba(88, 166, 255, 0.12);
      }
      .color-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }
      .pill-meta {
        color: var(--text-dim);
        font-size: 0.9em;
      }
      .topic-cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 12px;
      }
      .topic-card {
        padding: 14px;
        background: #0d1117;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
      }
      .topic-card:hover,
      .topic-card.active-filter {
        border-color: var(--accent-blue);
        background: #131922;
      }
      .topic-card-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .topic-id-badge {
        font-family: Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 0.75em;
        font-weight: 700;
        padding: 1px 6px;
        border-radius: 4px;
        border: 1px solid;
      }
      .topic-card-title {
        font-weight: 600;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .topic-card-count {
        font-size: 0.82em;
        color: var(--text-dim);
        white-space: nowrap;
      }
      .topic-bar-track {
        height: 5px;
        background: #21262d;
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 8px;
      }
      .topic-bar-fill {
        height: 100%;
        border-radius: 3px;
      }
      .topic-card-meta {
        font-size: 0.78em;
        color: var(--text-dim);
        margin-bottom: 8px;
      }
      .topic-headings-list {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .subheading-chip {
        font-size: 0.75em;
        padding: 2px 7px;
        background: #161b22;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        color: var(--text-dim);
      }
      .heading-cloud {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 8px;
      }
      .heading-tag {
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
        padding: 4px 10px;
        background: #0d1117;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        color: var(--text-main);
        cursor: pointer;
        line-height: 1.3;
        transition: border-color 0.15s, background 0.15s;
      }
      .heading-tag.level-1 {
        color: #f0f6fc;
        font-weight: 600;
      }
      .heading-tag.level-2 {
        color: var(--text-main);
      }
      .heading-tag:hover,
      .heading-tag.active-filter {
        border-color: var(--accent-blue);
        background: rgba(88, 166, 255, 0.14);
        color: var(--accent-blue);
      }
      .heading-count {
        font-size: 0.72em;
        color: var(--text-dim);
        font-family: Consolas, "Liberation Mono", Menlo, monospace;
      }
      .drill-header {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 14px;
      }
      .drill-title-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .drill-title-row h3 {
        margin: 0;
      }
      .active-filter-badge {
        background: rgba(88, 166, 255, 0.15);
        color: var(--accent-blue);
        border: 1px solid rgba(88, 166, 255, 0.4);
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 0.82em;
        font-weight: 600;
      }
      .drill-count-badge {
        font-size: 0.82em;
        color: var(--text-dim);
        font-family: Consolas, "Liberation Mono", Menlo, monospace;
      }
      .drill-search-row input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 12px;
        background: var(--input-bg);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        color: var(--text-main);
        font-size: 0.9em;
      }
      .overview-doc-list {
        max-height: 520px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .overview-doc-item {
        padding: 12px 14px;
        background: #0d1117;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }
      .overview-doc-item:hover {
        background: #1f2428;
        border-color: var(--accent-blue);
      }
      .doc-item-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 4px;
      }
      .doc-item-title {
        font-weight: 600;
        color: #f0f6fc;
      }
      .doc-item-badges {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .doc-root-badge,
      .doc-topic-badge {
        font-size: 0.75em;
        padding: 1px 8px;
        border-radius: 999px;
        background: #161b22;
        border: 1px solid var(--border-color);
        color: var(--text-dim);
      }
      .doc-item-path {
        margin-bottom: 6px;
      }
      .doc-top-headings {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .doc-heading-chip {
        font-size: 0.74em;
        padding: 1px 6px;
        background: #161b22;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        color: var(--text-dim);
      }

      .search-box {
        display: flex;
        gap: 12px;
        margin-bottom: 30px;
        padding: 20px;
        background: var(--container-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
      }

      .search-box input {
        flex-grow: 1;
        padding: 12px 16px;
        background: var(--input-bg);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        color: var(--text-main);
        font-size: 16px;
      }

      .search-box input:focus {
        outline: none;
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
      }

      .btn {
        padding: 10px 20px;
        background: var(--accent-blue);
        color: #ffffff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        transition: opacity 0.2s;
      }

      .btn:hover {
        opacity: 0.9;
      }
      .btn-sync {
        background: var(--accent-green);
      }

      .result-item {
        border-bottom: 1px solid var(--border-color);
        padding: 20px 0;
      }

      .result-path {
        color: var(--accent-blue);
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 0.85em;
        margin-bottom: 8px;
      }

      .result-score {
        float: right;
        color: var(--text-dim);
        font-size: 0.8em;
        background: #21262d;
        padding: 2px 8px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
      }

      .result-content {
        font-size: 0.95em;
        color: var(--text-main);
      }

      .sync-section {
        margin-top: 60px;
        padding: 30px;
        background: var(--container-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
      }

      .progress-container {
        margin-top: 15px;
      }
      .progress-bar {
        height: 8px;
        background: #30363d;
        border-radius: 4px;
        overflow: hidden;
        width: 100%;
        margin-bottom: 10px;
      }
      .progress-inner {
        height: 100%;
        background: var(--accent-green);
        width: 0%;
        transition: width 0.3s;
      }
      .sync-info {
        font-size: 0.9em;
        color: var(--text-dim);
      }

      /* Two-Pane Layout */
      .app-layout {
        display: flex;
        gap: 20px;
        align-items: flex-start;
      }
      .left-pane {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .right-pane {
        flex: 1;
        min-width: 0;
        background: var(--container-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 20px;
        position: sticky;
        top: 20px;
        max-height: calc(100vh - 40px);
        overflow-y: auto;
        display: none;
      }
      .btn-close {
        float: right;
        background: var(--border-color);
        padding: 5px 10px;
        font-size: 0.8em;
        margin-bottom: 15px;
      }
      .result-item {
        cursor: pointer;
        transition: background 0.2s;
        padding: 15px;
        border-radius: 6px;
        border: 1px solid transparent;
        border-bottom: 1px solid var(--border-color);
      }
      .result-item:hover {
        background: #1f2428;
        border-color: #30363d;
      }

      /* Markdown Styling */
      .markdown-body pre,
      .result-content pre {
        background-color: #0d1117;
        border: 1px solid var(--border-color);
        padding: 0.75rem;
        border-radius: 0.375rem;
        overflow-x: auto;
        margin: 0.5rem 0;
      }
      .markdown-body code,
      .result-content code {
        font-family: Consolas, "Liberation Mono", Menlo, monospace;
        background-color: #21262d;
        padding: 0.1rem 0.3rem;
        border-radius: 0.25rem;
        font-size: 0.85em;
      }
      .markdown-body blockquote {
        border-left: 3px solid var(--border-color);
        padding-left: 10px;
        color: var(--text-dim);
        margin: 0;
      }
      .markdown-body p {
        margin-bottom: 10px;
      }
      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3,
      .markdown-body h4 {
        margin-top: 1.5em;
        margin-bottom: 0.5em;
        color: var(--text-main);
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 0.3em;
      }
      .markdown-body img {
        max-width: 100%;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <h1>RAG Search Engine</h1>

    <div class="app-layout">
      <div class="left-pane">
        <div class="nav-tabs" role="tablist">
          <button
            type="button"
            id="tab-btn-search"
            class="tab-btn active"
            role="tab"
            aria-selected="true"
            onclick="switchTab('search')"
          >
            Search
          </button>
          <button
            type="button"
            id="tab-btn-overview"
            class="tab-btn"
            role="tab"
            aria-selected="false"
            hx-get="/overview"
            hx-trigger="click once"
            hx-target="#overview-container"
            hx-swap="innerHTML"
            onclick="switchTab('overview')"
          >
            Overview &amp; Topic Clusters
          </button>
        </div>

        <div id="search-tab-pane">
          <form class="search-box" hx-post="/search" hx-target="#search-results">
            <input
              type="text"
              name="query"
              placeholder="Search your documents..."
            />
            <button type="submit" class="btn">Search</button>
          </form>

          <div id="search-results">
            <!-- Search results will appear here -->
          </div>

          <div class="sync-section">
            <h3>Index Sync</h3>
            <p style="color: var(--text-dim); margin-bottom: 20px">
              Index your local markdown files to enable semantic search.
            </p>
            <div id="sync-container">
              <button
                class="btn btn-sync"
                hx-post="/sync"
                hx-target="#sync-container"
                hx-swap="outerHTML"
              >
                Start Full Index Sync
              </button>
            </div>
          </div>
        </div>

        <div id="overview-tab-pane" style="display: none;">
          <div id="overview-container">
            <div class="overview-panel-card">
              <p style="color: var(--text-dim); margin: 0;">Loading index overview and topic clusters...</p>
            </div>
          </div>
        </div>
      </div>

      <div class="right-pane" id="document-pane">
        <button class="btn btn-close" onclick="closeDocument()">Close</button>
        <div id="document-content" class="markdown-body"></div>
      </div>
    </div>

    <script>
      const md = window.markdownit({
        html: true,
        linkify: true,
        typographer: true,
      });

      let currentOverviewFilter = {
        type: null,
        value: null,
        docIds: null,
        label: "All Documents",
      };

      function switchTab(tabName) {
        const searchPane = document.getElementById("search-tab-pane");
        const overviewPane = document.getElementById("overview-tab-pane");
        const searchBtn = document.getElementById("tab-btn-search");
        const overviewBtn = document.getElementById("tab-btn-overview");

        if (tabName === "overview") {
          searchPane.style.display = "none";
          overviewPane.style.display = "block";
          searchBtn.classList.remove("active");
          searchBtn.setAttribute("aria-selected", "false");
          overviewBtn.classList.add("active");
          overviewBtn.setAttribute("aria-selected", "true");
        } else {
          searchPane.style.display = "block";
          overviewPane.style.display = "none";
          overviewBtn.classList.remove("active");
          overviewBtn.setAttribute("aria-selected", "false");
          searchBtn.classList.add("active");
          searchBtn.setAttribute("aria-selected", "true");
        }
      }

      function clearActiveHighlights() {
        document
          .querySelectorAll(
            ".treemap-node.active-filter, .root-pill.active-filter, .topic-card.active-filter, .heading-tag.active-filter",
          )
          .forEach((el) => el.classList.remove("active-filter"));
      }

      function applyOverviewFilter(type, value, label, clickedEl) {
        if (
          currentOverviewFilter.type === type &&
          currentOverviewFilter.value === value
        ) {
          clearOverviewFilter();
          return;
        }
        currentOverviewFilter = {
          type: type,
          value: value,
          docIds: null,
          label: label,
        };
        clearActiveHighlights();
        if (clickedEl) {
          clickedEl.classList.add("active-filter");
        }
        filterOverviewDocRows();
      }

      function applyOverviewHeadingFilter(buttonEl) {
        const headingText = buttonEl.getAttribute("data-heading-text");
        if (
          currentOverviewFilter.type === "heading" &&
          currentOverviewFilter.value === headingText
        ) {
          clearOverviewFilter();
          return;
        }
        const rawIds = buttonEl.getAttribute("data-doc-ids") || "";
        const docIds = new Set(
          rawIds
            .split(",")
            .map((s) => s.trim())
            .filter(Boolean),
        );
        currentOverviewFilter = {
          type: "heading",
          value: headingText,
          docIds: docIds,
          label: buttonEl.getAttribute("data-filter-label") || headingText,
        };
        clearActiveHighlights();
        buttonEl.classList.add("active-filter");
        filterOverviewDocRows();
      }

      function clearOverviewFilter() {
        currentOverviewFilter = {
          type: null,
          value: null,
          docIds: null,
          label: "All Documents",
        };
        clearActiveHighlights();
        filterOverviewDocRows();
      }

      function filterOverviewDocRows() {
        const rows = document.querySelectorAll("#overview-doc-list .overview-doc-item");
        const searchInput = document.getElementById("overview-doc-filter-input");
        const query = searchInput ? searchInput.value.trim().toLowerCase() : "";
        let visibleCount = 0;

        rows.forEach((row) => {
          let matchesFilter = true;
          if (currentOverviewFilter.type === "root") {
            matchesFilter =
              row.getAttribute("data-root-id") === currentOverviewFilter.value;
          } else if (currentOverviewFilter.type === "topic") {
            matchesFilter =
              row.getAttribute("data-topic-id") === currentOverviewFilter.value;
          } else if (
            currentOverviewFilter.type === "heading" &&
            currentOverviewFilter.docIds
          ) {
            matchesFilter = currentOverviewFilter.docIds.has(
              row.getAttribute("data-doc-id"),
            );
          }

          let matchesSearch = true;
          if (query) {
            const haystack = row.getAttribute("data-search-text") || "";
            matchesSearch = haystack.includes(query);
          }

          if (matchesFilter && matchesSearch) {
            row.style.display = "";
            visibleCount += 1;
          } else {
            row.style.display = "none";
          }
        });

        const badge = document.getElementById("overview-active-filter");
        if (badge) {
          badge.textContent = currentOverviewFilter.label;
        }
        const countBadge = document.getElementById("overview-visible-count");
        if (countBadge) {
          countBadge.textContent = visibleCount + " / " + rows.length;
        }
        const clearBtn = document.getElementById("overview-clear-filter");
        if (clearBtn) {
          clearBtn.style.display = currentOverviewFilter.type ? "inline-block" : "none";
        }
      }

      document.body.addEventListener("htmx:afterSwap", function (evt) {
        if (evt.detail.target.id === "search-results") {
          const contents = document.querySelectorAll(".raw-markdown");
          contents.forEach((el) => {
            if (!el.dataset.rendered) {
              el.innerHTML = md.render(el.textContent);
              el.dataset.rendered = "true";
            }
          });
        } else if (evt.detail.target.id === "overview-container") {
          clearOverviewFilter();
        }
      });

      async function loadDocument(path) {
        const pane = document.getElementById("document-pane");
        const content = document.getElementById("document-content");
        pane.style.display = "block";
        content.innerHTML = "<p>Loading document...</p>";

        try {
          const response = await fetch(
            "/api/document?path=" + encodeURIComponent(path),
          );
          if (!response.ok) throw new Error("Fetch failed");
          const text = await response.text();
          content.innerHTML = md.render(text);
        } catch (err) {
          content.innerHTML =
            '<p style="color:#ff7b72">Error loading document: ' + err + "</p>";
        }
      }

      function closeDocument() {
        document.getElementById("document-pane").style.display = "none";
      }
    </script>
  </body>
</html>
